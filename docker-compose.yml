# ============================================================
# Ambiente big-data-ecommerce (Semanas 1 a 3)
#
#   Flume  : captura os logs do gerador  -> sink de teste (funcionando)
#   HDFS   : NameNode + DataNode         -> "no ar" (ainda sem uso direto)
#   Flink  : JobManager + TaskManager    -> job de trending + alertas no HBase
#   Spark  : Master + Worker (standalone)-> job de ETL/insights (Semana 3)
#   HBase  : standalone + REST           -> insights (Spark) e alertas (Flink)
#   Hive   : HiveServer2 (metastore embutido) -> tabelas externas sobre o Parquet do Spark
#
# Subir tudo:     docker compose up -d
# Ver situação:   docker compose ps
# Derrubar tudo:  docker compose down
#
# Passo a passo da Semana 3: spark-job/README.md
# ============================================================

services:

  # ---------------- FLUME (igual ao que você já tinha) ----------------
  flume:
    build:
      context: ./flume
    container_name: flume-semana1
    volumes:
      - ./data:/data/incoming
      - ./flume-output:/data/output
      - ./flume-state:/data/state
    restart: "no"

  # ---------------- HDFS ----------------
  namenode:
    image: apache/hadoop:3.3.6
    container_name: hdfs-namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    env_file:
      - ./hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"   # formata o HDFS na 1a vez
    ports:
      - "9870:9870"      # painel web do NameNode
    restart: "no"

  datanode:
    image: apache/hadoop:3.3.6
    container_name: hdfs-datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    env_file:
      - ./hadoop.env
    depends_on:
      - namenode
    restart: "on-failure:5"

  # ---------------- FLINK ----------------
  jobmanager:
    image: flink:2.2.1-java17
    container_name: flink-jobmanager
    hostname: jobmanager
    command: jobmanager
    ports:
      - "8081:8081"      # painel web do Flink
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1024m
    volumes:
      - ./flume-output:/data/flume-output:ro
      - ./flink-output:/data/flink-output
    restart: "no"

  taskmanager:
    image: flink:2.2.1-java17
    container_name: flink-taskmanager
    hostname: taskmanager
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1024m
    volumes:
      - ./flume-output:/data/flume-output:ro
      - ./flink-output:/data/flink-output
    restart: "no"

  # ---------------- SPARK (modo standalone) ----------------
  spark-master:
    image: spark:4.1.2-scala2.13-java21-ubuntu
    container_name: spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "8080:8080"      # painel web do Spark Master
      - "7077:7077"      # porta de conexão dos jobs
    volumes:
      - ./flume-output:/data/flume-output:ro
      - ./spark-output:/data/spark-output
      - ./spark-job:/jobs:ro
    restart: "no"

  spark-worker:
    image: spark:4.1.2-scala2.13-java21-ubuntu
    container_name: spark-worker
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "1g"
      SPARK_WORKER_DIR: "/tmp/spark-work"
    ports:
      - "8082:8081"      # painel web do Worker (8082 no Windows, para não colidir com o Flink)
    volumes:
      - ./flume-output:/data/flume-output:ro
      - ./spark-output:/data/spark-output
      - ./spark-job:/jobs:ro
    depends_on:
      - spark-master
    restart: "no"

  # ============================================================
  # Ambiente da Semana 3 - Job Spark (ETL + wide dependencies) + Hive + HBase
  #
  #   HBase : Master standalone + REST server -> recebe os insights do Spark
  #           e os alertas de trending do Flink (tudo via API REST, sem
  #           precisar casar versões de client jar entre os três motores)
  #   Hive  : HiveServer2 (metastore embutido) -> tabelas externas em cima
  #           dos Parquets que o job Spark grava em ./spark-output
  #
  # Ver README de detalhes: spark-job/README.md
  # ============================================================

  # ---------------- HBASE (standalone + REST) ----------------
  hbase:
    image: bde2020/hbase-standalone:1.0.0-hbase1.2.6
    container_name: hbase-standalone
    hostname: hbase
    environment:
      HBASE_MANAGES_ZK: "true"
    ports:
      - "16010:16010"
      - "8083:8080"
    volumes:
      - ./hbase-data:/hbase-data
    restart: "no"

  # ---------------- HIVE (HiveServer2 + metastore embutido) ----------------
  hive:
    image: apache/hive:3.1.3
    container_name: hive-server
    hostname: hive
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        export HADOOP_CLIENT_OPTS="-Xmx1G -Dhive.metastore.schema.verification=false -Ddatanucleus.schema.autoCreateAll=true -Ddatanucleus.autoCreateSchema=true"
        exec /opt/hive/bin/hive --service hiveserver2
    ports:
      - "10000:10000"    
      - "10002:10002"    
    volumes:
      - ./spark-output:/opt/hive/data/warehouse/spark_output:ro
      - ./spark-job:/opt/hive/scripts:ro
    restart: "no"