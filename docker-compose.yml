# ============================================================
# Ambiente da Semana 1 - big-data-ecommerce
#
#   Flume  : captura os logs do gerador  -> sink de teste (funcionando)
#   HDFS   : NameNode + DataNode         -> apenas "no ar" (sem uso ainda)
#   Flink  : JobManager + TaskManager    -> apenas "no ar" (sem jobs ainda)
#   Spark  : Master + Worker (standalone)-> apenas "no ar" (sem jobs ainda)
#
# Subir tudo:     docker compose up -d
# Ver situação:   docker compose ps
# Derrubar tudo:  docker compose down
# ============================================================

services:

  # ---------------- FLUME (igual ao que você já tinha) ----------------
  flume:
    build:
      context: ./flume
    container_name: flume-semana1
    volumes:
      - ./data:/data/incoming
      - ./flume-output:/data/output
      - ./flume-state:/data/state
    restart: "no"

  # ---------------- HDFS ----------------
  namenode:
    image: apache/hadoop:3.3.6
    container_name: hdfs-namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    env_file:
      - ./hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"   # formata o HDFS na 1a vez
    ports:
      - "9870:9870"      # painel web do NameNode
    restart: "no"

  datanode:
    image: apache/hadoop:3.3.6
    container_name: hdfs-datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    env_file:
      - ./hadoop.env
    depends_on:
      - namenode
    restart: "on-failure:5"

  # ---------------- FLINK ----------------
  jobmanager:
    image: flink:2.2.1-java17
    container_name: flink-jobmanager
    hostname: jobmanager
    command: jobmanager
    ports:
      - "8081:8081"      # painel web do Flink
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1024m
    volumes:
      - ./flume-output:/data/flume-output:ro
      - ./flink-output:/data/flink-output
    restart: "no"

  taskmanager:
    image: flink:2.2.1-java17
    container_name: flink-taskmanager
    hostname: taskmanager
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1024m
    volumes:
      - ./flume-output:/data/flume-output:ro
      - ./flink-output:/data/flink-output
    restart: "no"
  
  # ---------------- SPARK (modo standalone) ----------------
  spark-master:
    image: spark:4.1.2-scala2.13-java21-ubuntu
    container_name: spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "8080:8080"      # painel web do Spark Master
      - "7077:7077"      # porta de conexão dos jobs
    restart: "no"

  spark-worker:
    image: spark:4.1.2-scala2.13-java21-ubuntu
    container_name: spark-worker
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "1g"
      SPARK_WORKER_DIR: "/tmp/spark-work"
    ports:
      - "8082:8081"      # painel web do Worker (8082 no Windows, para não colidir com o Flink)
    depends_on:
      - spark-master
    restart: "no"
